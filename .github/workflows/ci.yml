
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker-validation:
    name: Docker configuration and build
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: relayflow
      POSTGRES_USER: relayflow
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL_DOCKER: postgresql+psycopg://relayflow:ci-only-password@postgres:5432/relayflow

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare local environment file
        run: touch .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet

      - name: Build Docker images
        run: docker compose build
